name: Deploy Multi-VPS

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  deploy-db:
    name: Deploy Database (VPS 2)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Debug Network & Secrets
        env:
          DB_HOST: ${{ secrets.VPS_DB_HOST }}
          DB_USER: ${{ secrets.VPS_DB_USER }}
        run: |
          echo "=== DIAGNÓSTICO DE SECRETOS ==="
          
          # 1. Verificar HOST
          if [ -z "$DB_HOST" ]; then 
            echo "❌ ERROR: VPS_DB_HOST está vacío."
            exit 1
          else 
            echo "✅ VPS_DB_HOST tiene valor."
            echo "   Longitud: ${#DB_HOST} caracteres."
            
            # Chequear espacios o saltos de línea
            if [[ "$DB_HOST" =~ [[:space:]] ]]; then
              echo "⚠️  ALERTA CRÍTICA: VPS_DB_HOST contiene espacios o saltos de línea. ¡Edita el secreto y bórralos!"
              # Intentamos mostrar dónde (reemplazando espacios por _)
              echo "   Valor sanitizado visualmente: '${DB_HOST// /_}'"
            else
              echo "✅ Formato parece correcto (sin espacios)."
            fi
          fi

          # 2. Verificar USER
          if [ -z "$DB_USER" ]; then 
             echo "❌ ERROR: VPS_DB_USER está vacío."
          else
             echo "✅ VPS_DB_USER configurado: '$DB_USER'"
          fi
          
          echo ""
          echo "=== DIAGNÓSTICO DE RED ==="
          echo "Intentando conectar al puerto 22 (SSH) en $DB_HOST..."
          
          # Usamos timeout de 5 segundos
          if nc -zv -w 5 "$DB_HOST" 22; then
            echo "✅ CONEXIÓN EXITOSA: El puerto 22 está abierto y responde."
          else
            echo "❌ CONEXIÓN FALLIDA: No se puede llegar al puerto 22."
            echo "   Causas probables:"
            echo "   1. La IP '$DB_HOST' es incorrecta."
            echo "   2. El Firewall del VPS está bloqueando la IP de GitHub Actions."
            echo "   3. El servicio SSHD no está corriendo en el VPS."
            exit 1
          fi

      - name: Add VPS to known hosts
        run: |
          mkdir -p ~/.ssh
          echo "Running ssh-keyscan with verbose output..."
          ssh-keyscan -v -H ${{ secrets.VPS_DB_HOST }} >> ~/.ssh/known_hosts 2> keyscan_error.log || cat keyscan_error.log

      - name: Create deployment package
        run: |
          tar -czf deploy_db.tar.gz \
            --exclude=node_modules \
            --exclude=.git \
            --exclude=.github \
            --exclude=.venv \
            --exclude=data/generated \
            --exclude=data/bulk_load_batch \
            --exclude=client/node_modules \
            --exclude=server/node_modules \
            . || [ $? -eq 1 ]

      - name: Copy files to DB VPS
        run: |
          scp deploy_db.tar.gz ${{ secrets.VPS_DB_USER }}@${{ secrets.VPS_DB_HOST }}:/tmp/

      - name: Provision DB Server
        run: |
          ssh ${{ secrets.VPS_DB_USER }}@${{ secrets.VPS_DB_HOST }} << 'ENDSSH'
            set -e
            DEPLOY_DIR="/home/$USER/geospatial-incident-platform"
            mkdir -p $DEPLOY_DIR
            cd $DEPLOY_DIR
            
            # Extract for provisioning
            tar -xzf /tmp/deploy_db.tar.gz
            
            # Run Provisioning
            chmod +x infra/scripts/provision.sh
            ./infra/scripts/provision.sh
          ENDSSH

      - name: Deploy and Initialize DB
        run: |
          ssh ${{ secrets.VPS_DB_USER }}@${{ secrets.VPS_DB_HOST }} << 'ENDSSH'
            set -e
            
            # Variables
            DEPLOY_DIR="/home/$USER/geospatial-incident-platform"
            
            # Prepare Directory
            mkdir -p $DEPLOY_DIR
            cd $DEPLOY_DIR
            
            # Extract (Again, to be sure or just use existing)
            # We already extracted in provision step, but let's ensure clean state if needed
            # Actually, we can just continue.
            
            rm -f /tmp/deploy_db.tar.gz
            
            # Setup Env
            if [ ! -f infra/docker/.env.postgis ]; then
              cp infra/docker/.env.postgis.example infra/docker/.env.postgis
            fi
            # We need backend env for migration runner
            if [ ! -f infra/docker/.env.backend ]; then
              cp infra/docker/.env.backend.example infra/docker/.env.backend
            fi
            
            # Ensure scripts are executable
            chmod +x tools/bulk_load/*.sh
            
            # Start DB
            echo "Starting Database..."
            docker compose up -d db
            
            # Wait for DB
            echo "Waiting for DB to be ready..."
            sleep 10
            until docker compose exec -T db pg_isready -U gis_dev -d gis; do
                echo "Waiting..."
                sleep 5
            done
            
            # Run Migrations (using backend container on DB node temporarily)
            echo "Running Migrations and Seeds..."
            docker compose run --rm backend sh -c "npm install && npm run migrate:up && npm run db:seed"
            
            # Run Auto Load Logic
            echo "Checking for Data Load..."
            ./tools/bulk_load/auto_deploy_db.sh
            
            # Clean up backend images/containers if desired, but keeping them cached is fine.
          ENDSSH

  deploy-app:
    name: Deploy App (VPS 1)
    needs: deploy-db
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Add VPS to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_APP_HOST }} >> ~/.ssh/known_hosts

      - name: Create deployment package
        run: |
          tar -czf deploy_app.tar.gz \
            --exclude=node_modules \
            --exclude=.git \
            --exclude=.github \
            --exclude=.venv \
            --exclude=data/generated \
            --exclude=data/bulk_load_batch \
            --exclude=client/node_modules \
            --exclude=server/node_modules \
            . || [ $? -eq 1 ]

      - name: Copy files to App VPS
        run: |
          scp deploy_app.tar.gz ${{ secrets.VPS_APP_USER }}@${{ secrets.VPS_APP_HOST }}:/tmp/

      - name: Provision App Server
        run: |
          ssh ${{ secrets.VPS_APP_USER }}@${{ secrets.VPS_APP_HOST }} << 'ENDSSH'
            set -e
            DEPLOY_DIR="/home/$USER/geospatial-incident-platform"
            mkdir -p $DEPLOY_DIR
            cd $DEPLOY_DIR
            
            # Extract for provisioning
            tar -xzf /tmp/deploy_app.tar.gz
            
            # Run Provisioning
            chmod +x infra/scripts/provision.sh
            ./infra/scripts/provision.sh
          ENDSSH

      - name: Deploy App Services
        run: |
          ssh ${{ secrets.VPS_APP_USER }}@${{ secrets.VPS_APP_HOST }} << 'ENDSSH'
            set -e
            
            DEPLOY_DIR="/home/$USER/geospatial-incident-platform"
            DB_HOST="${{ secrets.VPS_DB_HOST }}"
            
            mkdir -p $DEPLOY_DIR
            cd $DEPLOY_DIR
            
            # Already extracted in provision step
            rm -f /tmp/deploy_app.tar.gz
            
            # Setup Envs
            if [ ! -f infra/docker/.env.backend ]; then
              cp infra/docker/.env.backend.example infra/docker/.env.backend
            fi
            if [ ! -f infra/docker/.env.frontend ]; then
              cp infra/docker/.env.frontend.example infra/docker/.env.frontend
            fi
            
            # Configure Backend to point to DB Host
            # We update DATABASE_HOST in .env.backend
            sed -i.bak -E "s|^DATABASE_HOST=.*|DATABASE_HOST=$DB_HOST|g" infra/docker/.env.backend || true
            if ! grep -q '^DATABASE_HOST=' infra/docker/.env.backend; then
              echo "DATABASE_HOST=$DB_HOST" >> infra/docker/.env.backend
            fi
            
            # Configure Frontend
            PUBLIC_IP=$(curl -s ifconfig.me || echo "localhost")
            API_HOST="$PUBLIC_IP"
            FRONTEND_API_BASE="http://${API_HOST}:4000/api"
            
            sed -i.bak -E "s|^VITE_API_BASE_URL=.*|VITE_API_BASE_URL=${FRONTEND_API_BASE}|g" infra/docker/.env.frontend || true
            
            # Start App Services
            echo "Starting App Services..."
            docker compose up -d backend frontend
            
            # Health Check
            echo "Checking Backend Health..."
            sleep 10
            docker compose exec -T backend wget -q --spider http://localhost:4000/healthz || echo "Warning: Backend health check failed"
          ENDSSH
