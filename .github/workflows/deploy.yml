name: Deploy Multi-VPS

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  deploy-db:
    name: Deploy Database (VPS 2)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Add VPS to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_DB_HOST }} >> ~/.ssh/known_hosts

      - name: Create deployment package
        run: |
          tar -czf deploy_db.tar.gz \
            --exclude=node_modules \
            --exclude=.git \
            --exclude=.github \
            --exclude=.venv \
            --exclude=data/generated \
            --exclude=data/bulk_load_batch \
            --exclude=client/node_modules \
            --exclude=server/node_modules \
            . || [ $? -eq 1 ]

      - name: Copy files to DB VPS
        run: |
          scp deploy_db.tar.gz ${{ secrets.VPS_DB_USER }}@${{ secrets.VPS_DB_HOST }}:/tmp/

      - name: Deploy and Initialize DB
        run: |
          ssh ${{ secrets.VPS_DB_USER }}@${{ secrets.VPS_DB_HOST }} << 'ENDSSH'
            set -e
            
            # Variables
            DEPLOY_DIR="/home/$USER/geospatial-incident-platform"
            
            # Prepare Directory
            mkdir -p $DEPLOY_DIR
            cd $DEPLOY_DIR
            
            # Extract
            tar -xzf /tmp/deploy_db.tar.gz
            rm /tmp/deploy_db.tar.gz
            
            # Setup Env
            if [ ! -f infra/docker/.env.postgis ]; then
              cp infra/docker/.env.postgis.example infra/docker/.env.postgis
            fi
            # We need backend env for migration runner
            if [ ! -f infra/docker/.env.backend ]; then
              cp infra/docker/.env.backend.example infra/docker/.env.backend
            fi
            
            # Ensure scripts are executable
            chmod +x tools/bulk_load/*.sh
            
            # Start DB
            echo "Starting Database..."
            docker compose up -d db
            
            # Wait for DB
            echo "Waiting for DB to be ready..."
            sleep 10
            until docker compose exec -T db pg_isready -U gis_dev -d gis; do
                echo "Waiting..."
                sleep 5
            done
            
            # Run Migrations (using backend container on DB node temporarily)
            echo "Running Migrations and Seeds..."
            docker compose run --rm backend sh -c "npm install && npm run migrate:up && npm run db:seed"
            
            # Run Auto Load Logic
            echo "Checking for Data Load..."
            ./tools/bulk_load/auto_deploy_db.sh
            
            # Clean up backend images/containers if desired, but keeping them cached is fine.
          ENDSSH

  deploy-app:
    name: Deploy App (VPS 1)
    needs: deploy-db
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Add VPS to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_APP_HOST }} >> ~/.ssh/known_hosts

      - name: Create deployment package
        run: |
          tar -czf deploy_app.tar.gz \
            --exclude=node_modules \
            --exclude=.git \
            --exclude=.github \
            --exclude=.venv \
            --exclude=data/generated \
            --exclude=data/bulk_load_batch \
            --exclude=client/node_modules \
            --exclude=server/node_modules \
            . || [ $? -eq 1 ]

      - name: Copy files to App VPS
        run: |
          scp deploy_app.tar.gz ${{ secrets.VPS_APP_USER }}@${{ secrets.VPS_APP_HOST }}:/tmp/

      - name: Deploy App Services
        run: |
          ssh ${{ secrets.VPS_APP_USER }}@${{ secrets.VPS_APP_HOST }} << 'ENDSSH'
            set -e
            
            DEPLOY_DIR="/home/$USER/geospatial-incident-platform"
            DB_HOST="${{ secrets.VPS_DB_HOST }}"
            
            mkdir -p $DEPLOY_DIR
            cd $DEPLOY_DIR
            
            tar -xzf /tmp/deploy_app.tar.gz
            rm /tmp/deploy_app.tar.gz
            
            # Setup Envs
            if [ ! -f infra/docker/.env.backend ]; then
              cp infra/docker/.env.backend.example infra/docker/.env.backend
            fi
            if [ ! -f infra/docker/.env.frontend ]; then
              cp infra/docker/.env.frontend.example infra/docker/.env.frontend
            fi
            
            # Configure Backend to point to DB Host
            # We update DATABASE_HOST in .env.backend
            sed -i.bak -E "s|^DATABASE_HOST=.*|DATABASE_HOST=$DB_HOST|g" infra/docker/.env.backend || true
            if ! grep -q '^DATABASE_HOST=' infra/docker/.env.backend; then
              echo "DATABASE_HOST=$DB_HOST" >> infra/docker/.env.backend
            fi
            
            # Configure Frontend
            PUBLIC_IP=$(curl -s ifconfig.me || echo "localhost")
            API_HOST="$PUBLIC_IP"
            FRONTEND_API_BASE="http://${API_HOST}:4000/api"
            
            sed -i.bak -E "s|^VITE_API_BASE_URL=.*|VITE_API_BASE_URL=${FRONTEND_API_BASE}|g" infra/docker/.env.frontend || true
            
            # Start App Services
            echo "Starting App Services..."
            docker compose up -d backend frontend
            
            # Health Check
            echo "Checking Backend Health..."
            sleep 10
            docker compose exec -T backend wget -q --spider http://localhost:4000/healthz || echo "Warning: Backend health check failed"
          ENDSSH
